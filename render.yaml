# Planes contratados el 12 de octubre de 2026.
services:
  - type: web
    name: flamitas-web
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: flamitas-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERS_JSON
        sync: false
databases:
  - name: flamitas-db
    region: virginia
    plan: 0.5c-1g
    databaseName: flamitas
    user: flamitas
    ipAllowList:
      - source: 200.40.88.18/32
        description: Respaldo computadora
