<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <meta name="theme-color" content="#6d4a88">
    <title>Contacto | Flamitas de Hécate</title>
    <link rel="icon" type="image/png" href="./img/app-icon-192.png">
    <link rel="apple-touch-icon" href="./img/app-icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">

    <link rel="stylesheet" href="./css/styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Menú superior de la página de contacto. -->
    <header class="menu">
        <nav>
            <!-- Logo de Flamitas en el menú; al tocarlo vuelve al inicio. -->
            <a href="index.html" class="logo-menu" aria-label="Ir al inicio">
                <img src="./img/logo-flamitas-manos.png" alt="Logo Flamitas de Hécate">
            </a>

            <div class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <ul class="menu-links" id="menuLinks">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="tienda.html">Tienda</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html" hidden>Ingresar</a></li>
            </ul>
        </nav>
    </header>

    <!-- Encabezado simple para la página de contacto. -->
    <section class="header header-contacto">
        <h1>Contacto</h1>
        <p>Escribinos tu consulta y te respondemos a la brevedad</p>
    </section>

    <!-- Formulario para recibir consultas de clientes. -->
    <section class="formulario-acceso formulario-contacto">
        <h2>Hablemos</h2>
        <p>Completá tus datos para que podamos responderte.</p>

        <form id="formContacto">
            <label for="nombreContacto">Nombre</label>
            <input type="text" id="nombreContacto" required>

            <label for="telefonoContacto">Teléfono</label>
            <input type="tel" id="telefonoContacto" required>

            <label for="emailContacto">Mail</label>
            <input type="email" id="emailContacto" required>

            <label for="mensajeContacto">Mensaje</label>
            <textarea id="mensajeContacto" rows="6" required></textarea>

            <input type="submit" value="Enviar consulta">
        </form>

        <p id="mensajeContactoEstado" class="mensaje-formulario"></p>
    </section>

    <!-- Pie de página de la web. -->
    <footer class="footer">
        <p>© Flamitas de Hécate</p>
    </footer>

    <!-- Conecta el menú y el formulario de contacto con sus funciones. -->
    <script src="./js/api.js"></script>
    <script src="./js/usuarios.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/contacto.js"></script>
    <script src="./js/iniciar.js"></script>

    <a class="whatsapp-flotante" href="https://wa.me/59897605718" target="_blank" rel="noopener noreferrer" aria-label="Contactar a Flamitas por WhatsApp" title="Escribinos por WhatsApp">
        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M16 .8A15.1 15.1 0 0 0 3 23.5L.8 31.2l7.9-2.1A15.2 15.2 0 1 0 16 .8Zm0 27.6a12.5 12.5 0 0 1-6.4-1.8l-.5-.3-4.7 1.2 1.3-4.6-.3-.5A12.5 12.5 0 1 1 16 28.4Z"/>
            <path fill="currentColor" d="M12 8.5c-.3-.7-.6-.7-1-.7h-.8c-.4 0-.8.2-1.1.5-.4.5-1.5 1.5-1.5 3.6s1.5 4.1 1.7 4.4c.2.3 3 4.7 7.4 6.4 3.7 1.4 4.4 1.1 5.2 1 .8-.1 2.6-1.1 3-2.1.4-1 .4-1.9.3-2.1-.1-.2-.4-.3-.9-.6l-3-1.4c-.4-.2-.7-.3-1 .2l-1.4 1.7c-.2.3-.5.3-.9.1-1.3-.5-2.5-1.3-3.5-2.2-.9-.9-1.6-1.9-2.2-3-.2-.4 0-.6.2-.8l.7-.8.4-.7c.1-.3.1-.5 0-.8L12 8.5Z"/>
        </svg>
    </a>
</body>

</html>
