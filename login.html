<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <meta name="theme-color" content="#6d4a88">
    <title>Ingresar | Flamitas de Hécate</title>
    <link rel="icon" type="image/png" href="./img/app-icon-192.png">
    <link rel="apple-touch-icon" href="./img/app-icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">

    <link rel="stylesheet" href="./css/styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Menú superior para moverse entre inicio, tienda, admin y registro. -->
    <header class="menu">
        <nav>
            <!-- Logo de Flamitas en el menú; al tocarlo vuelve al inicio. -->
            <a href="index.html" class="logo-menu" aria-label="Ir al inicio">
                <img src="./img/logo-flamitas-manos.png" alt="Logo Flamitas de Hécate">
            </a>

            <ul class="menu-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="tienda.html">Tienda</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <!-- Formulario para iniciar sesión como cliente o administradora. -->
    <section class="formulario-acceso">
        <h1>Ingresar</h1>
        <p>Accedé a tu cuenta para armar y enviar tu pedido.</p>

        <form id="formLogin">
            <label for="emailLogin">Email</label>
            <input type="email" id="emailLogin" required>

            <label for="passwordLogin">Contraseña</label>
            <input type="password" id="passwordLogin" required>

            <input type="submit" value="Ingresar">
        </form>

        <p id="mensajeLogin" class="mensaje-formulario"></p>
        <p class="texto-formulario">¿No tenés cuenta? <a href="registro.html">Registrate acá</a></p>
    </section>

    <!-- Conecta el login con la lógica de usuarios. -->
    <script src="./js/api.js"></script>
    <script src="./js/usuarios.js"></script>
    <script src="./js/iniciar.js"></script>
</body>

</html>
